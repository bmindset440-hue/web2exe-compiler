name: Build Custom Windows EXE

on:
  repository_dispatch:
    types: [trigger-exe-build]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Inject User Input Config Dynamically
        shell: pwsh
        run: |
          $url = "${{ github.event.client_payload.target_url }}"
          $name = "${{ github.event.client_payload.app_name }}"
          
          $configPath = "src-tauri/tauri.conf.json"
          $json = Get-Content $configPath -Raw | ConvertFrom-Json
          
          $json.package.productName = $name
          $json.build.distDir = $url
          $json.tauri.windows[0].title = $name
          
          $json | ConvertTo-Json -Depth 10 | Set-Content $configPath
          Write-Host "Config updated for: $name ($url)"

      - name: Build Binary with Tauri CLI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-${{ github.run_id }}
          releaseName: "${{ github.event.client_payload.app_name }} Build"
          releaseBody: "Automated binary generated by WEB2EXE"
          releaseDraft: false
          prerelease: false
