name: Build Custom Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Logo & Convert to ICO
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          # Download your logo image
          Invoke-WebRequest -Uri "https://i.postimg.cc/Gm15qSGj/Professional-logo-design-for-WEB2EXE-modern-tech-company-logo-with-bold-typography-geometric-el.jpg" -OutFile "src-tauri/icons/logo.jpg"
          
          # Convert JPG to true Windows ICO format using System.Drawing
          Add-Type -AssemblyName System.Drawing
          $jpg = [System.Drawing.Image]::FromFile("src-tauri/icons/logo.jpg")
          $bmp = New-Object System.Drawing.Bitmap($jpg, 256, 256)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          
          $stream = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($stream)
          $stream.Close()
          $jpg.Dispose()
          $bmp.Dispose()

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web2EXE-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
