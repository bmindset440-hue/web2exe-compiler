name: Build Custom Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Create Dist Directory and Dummy Page
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          "<!DOCTYPE html><html><head><title>App</title></head><body><h1>Web2EXE Built Successfully</h1></body></html>" | Out-File -Encoding utf8 "dist/index.html"

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: src-tauri/target/release/bundle/msi/*.msi
